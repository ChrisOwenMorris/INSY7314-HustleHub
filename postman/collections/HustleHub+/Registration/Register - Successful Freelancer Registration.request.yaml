$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "username": "janedoe",
        "email": "jane@example.com",
        "password": "SecurePass1",
        "role": "freelancer"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () {
          pm.response.to.have.status(201);
      });

      pm.test('Response indicates success', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.status || jsonData.success).to.satisfy(function (val) {
              return val === 'success' || val === true;
          });
      });

      pm.test('Password is not present in response', function () {
          var responseText = pm.response.text();
          pm.expect(responseText).to.not.include('SecurePass1');
          pm.expect(responseText.toLowerCase()).to.not.include('"password"');
      });
    language: text/javascript
order: 1000
